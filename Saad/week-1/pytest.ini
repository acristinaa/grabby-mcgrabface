[pytest]
testpaths = tests
addopts = -ra
markers =
    unit: schnelle Pruefung reiner Logik (Sekunden)
    integration: Modelle bauen, Sim-Umgebung direkt ansprechen (Sekunden bis 1 min)
    e2e: kompletter Ablauf mit LeRobot-Roboter, Lauf-Controller und DDS (Minuten)
filterwarnings =
    ignore:.*parent has:UserWarning
    ignore:Attach conflict:UserWarning
    # numpy 2 mit Apple Accelerate meldet bei Matrixprodukten falsche Ueberlauf-Warnungen (mink, g1sim/perception.py)
    ignore:.*encountered in matmul:RuntimeWarning
